name: PR CI

# Pull-request verification on GitHub-hosted runners. Main is verified and
# deployed by Gitea after the merge reaches it, so this runs only on pull
# requests and by hand.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run portable checks
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node tests/test_model.mjs
          node tests/test_bar_model.mjs
          python -m py_compile tools/*.py tests/*.py
          python -c 'import json, pathlib; json.loads(pathlib.Path("manifest.json").read_text(encoding="utf-8"))'
          python tools/sync_stock_bar.py --upstream-dir vendor/omarchy-4.0.4-1/bar --check
          git diff --check

  ci-gate:
    name: CI gate
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = {'validate'}
          assert set(results) == expected, results
          for name, result in results.items():
              assert result["result"] == "success", name + " did not pass"
          PY
